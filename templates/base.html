<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <!-- Primary SEO -->

    <title>
        {% block title %}
        Yewo Sidira | Backend Software Engineer
        {% endblock %}
    </title>


    <meta name="description"
          content="Yewo Sidira is a Backend Software Engineer specializing in Python, Django, Flask, APIs, scalable systems, and clean software architecture.">


    <meta name="author"
          content="Yewo Sidira">



    <!-- Open Graph -->

    <meta property="og:title"
          content="Yewo Sidira | Backend Software Engineer">

    <meta property="og:description"
          content="Backend engineering portfolio showcasing scalable systems, APIs, architecture, and software projects.">

    <meta property="og:type"
          content="website">

    <meta property="og:url"
          content="https://yewo-sidira.onrender.com/">

    <!-- Twitter -->

    <meta name="twitter:card"
          content="summary">

    <meta name="twitter:title"
          content="Yewo Sidira | Backend Software Engineer">

    <meta name="twitter:description"
          content="Building scalable backend systems, APIs, and reliable software applications.">




    <!-- Canonical -->

    <link rel="canonical"
          href="https://yewo-sidira.onrender.com/">



    <!-- Favicon -->

    <link rel="icon"
          type="image/svg+xml"
          href="{{ url_for('static', filename='images/favicon.svg') }}">

    <link rel="apple-touch-icon"
          href="{{ url_for('static', filename='images/favicon.svg') }}">




    <!-- Performance -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">



    <!-- CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">



    <!-- Prevent theme flashing -->

    <script>

        (function () {

            const savedTheme = localStorage.getItem("theme");

            if (savedTheme) {

                document.documentElement.dataset.theme = savedTheme;

            }

        })();

    </script>




    <!-- Structured Data -->

    <script type="application/ld+json">

    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Yewo Sidira",
        "jobTitle": "Backend Software Engineer",
        "description": "Backend Software Engineer specializing in Python, Django, Flask, APIs, scalable systems, and clean software architecture.",
        "url": "https://yewo-sidira.onrender.com/",

        "sameAs": [
            "https://github.com/SIDIRAYEWO",
            "https://www.linkedin.com/in/yewo-sidira/"
        ],

        "knowsAbout": [
            "Python",
            "Django",
            "Flask",
            "REST APIs",
            "JavaScript",
            "Docker",
            "PostgreSQL",
            "Software Architecture"
        ]
    }

    </script>


</head>



<body>


    <!-- Animated Code Background -->

    <div class="code-background"
         aria-hidden="true">

        <div class="code-row code-row-1">
            <span>const</span>
            <span>function()</span>
            <span>return</span>
            <span>{ }</span>
            <span>async</span>
            <span>await</span>
            <span>import</span>
            <span>export</span>
        </div>

        <div class="code-row code-row-2">
            <span>Python</span>
            <span>def</span>
            <span>class</span>
            <span>API</span>
            <span>REST</span>
            <span>PostgreSQL</span>
            <span>Docker</span>
        </div>

        <div class="code-row code-row-3">
            <span>React</span>
            <span>JavaScript</span>
            <span>backend</span>
            <span>database</span>
            <span>server</span>
            <span>request</span>
            <span>response</span>
        </div>

        <div class="code-row code-row-4">
            <span>if</span>
            <span>else</span>
            <span>try</span>
            <span>except</span>
            <span>async</span>
            <span>await</span>
            <span>query()</span>
            <span>connect()</span>
        </div>

    </div>



    <a href="#main-content"
       class="skip-link">

        Skip to main content

    </a>



    {% block content %}

    {% endblock %}



    <script
        src="{{ url_for('static', filename='js/main.js') }}"
        defer>
    </script>


</body>

</html>
