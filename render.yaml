services:
  - type: web
    name: yewo-portfolio
    runtime: python

    buildCommand: |
      pip install -r requirements.txt

    startCommand: gunicorn app:app

  - type: web
    name: yewo-portfolio-static
    runtime: static
    buildCommand: pip install -r requirements.txt && python build_static.py
    staticPublishPath: dist
    envVars:
      - key: SITE_URL
        value: https://yewosidira.pro
